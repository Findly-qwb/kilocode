[package]
name = "kilo-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Kilo Desktop v2 Tauri shell: WebView host + IPC forwarding to kilo-host. No Node sidecar, no local HTTP server (PLAN §3.2)."

[lib]
name = "kilo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
kilo-host.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

# 终端（xterm）与沙箱是 feature 开关项，默认关闭（PLAN §13）。
[features]
default = []
terminal = []
sandbox = []
